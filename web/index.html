  const rows=isStd
    ? CARDS.map(c=>{ const hid=(S.stdHidden||{})[c[0]]; return `<div class="erow${hid?' hid':''}"><div class="etxt"><b>${c[0]}</b><span>${c[1]}</span></div><button class="btn small" type="button" data-hide="${esc(c[0])}">${hid?'Einblenden':'Ausblenden'}</button></div>`; }).join('')
    : D.cards.map((c,i)=>`<div class="erow"><div class="etxt" style="flex:1"><input class="inp" data-ef="${i}" value="${esc(c[0])}" maxlength="120" aria-label="Vorderseite"><textarea class="inp" data-eb="${i}" rows="2" maxlength="300" aria-label="Rückseite">${esc(c[1])}</textarea></div><button class="xbtn" type="button" data-edel="${i}" aria-label="Karte löschen">🗑️</button></div>`).join('');
  return `<section class="card" id="dk-editbox"><div class="row" style="justify-content:space-between"><div class="sec-label" style="margin:0">${isStd?'Klausur-Karten ein- und ausblenden':'Karten bearbeiten · Änderungen werden sofort gespeichert'}</div><button class="btn small" type="button" id="dk-editclose">Fertig</button></div>
    <div class="elist">${rows}</div>
    ${isStd?'':`<div class="sec-label" style="margin-top:14px">Eigene Karte hinzufügen</div><form id="dk-add" style="display:flex;flex-direction:column;gap:8px"><input id="dk-af" class="inp" maxlength="120" placeholder="Vorderseite, z. B. Nonan" autocomplete="off"><textarea id="dk-ab" class="inp" rows="2" maxlength="300" placeholder="Rückseite, z. B. C₉H₂₀ · 9 C-Atome"></textarea><button class="btn primary" type="submit">Karte hinzufügen</button></form>`}</section>`;
}
document.addEventListener('click',e=>{
  if(!location.hash.startsWith('#karten')) return;
  const h=e.target.closest('[data-hide]'), d=e.target.closest('[data-edel]');
  if(e.target.id==='dk-editclose'){ EDIT_DECK=false; deck=null; viewCards(); return; }
  if(h){ S.stdHidden=S.stdHidden||{}; const k=h.dataset.hide; const real=CARDS.find(c=>esc(c[0])===k||c[0]===k); const key=real?real[0]:k; if(S.stdHidden[key]) delete S.stdHidden[key]; else S.stdHidden[key]=1; save(); deck=null; viewCards(); return; }
  if(d){ const D=(S.decks||[]).find(x=>x.id===CUR_DECK); if(!D) return; const i=+d.dataset.edel; const front=D.cards[i]&&D.cards[i][0]; D.cards.splice(i,1); if(front) delete knownMap(D.id)[front]; save(); deck=null; toast('Karte gelöscht'); viewCards(); }
});
document.addEventListener('input',e=>{
  if(!location.hash.startsWith('#karten')) return;
  const D=(S.decks||[]).find(x=>x.id===CUR_DECK); if(!D) return;
  if(e.target.dataset.ef!=null){ const c=D.cards[+e.target.dataset.ef]; if(c){ c[0]=e.target.value; save(); deck=null; } }
  if(e.target.dataset.eb!=null){ const c=D.cards[+e.target.dataset.eb]; if(c){ c[1]=e.target.value; save(); deck=null; } }
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='dk-add') return; e.preventDefault();
  const D=(S.decks||[]).find(x=>x.id===CUR_DECK); const f=$('#dk-af').value.trim(), b=$('#dk-ab').value.trim(); if(!D||!f||!b){ toast('Fülle Vorder- und Rückseite aus'); return; }
  D.cards.push([f,b]); save(); deck=null; toast('Karte hinzugefügt'); viewCards(); const x=$('#dk-af'); if(x) x.focus();
});
function viewCards(){
  const decks=deckList(); let D=decks.find(d=>d.id===CUR_DECK); if(!D){ CUR_DECK='std'; D=decks[0]; }
  const K=knownMap(D.id), C=D.cards;
  if(!deck){ const unknown=C.filter(c=>K[c[0]]!=='ok'), known=C.filter(c=>K[c[0]]==='ok'); deck=shuffle(unknown).concat(shuffle(known)); }
  const sure=C.filter(c=>K[c[0]]==='ok').length;
  const isStd=D.id==='std', show=t=>isStd?t:esc(t);
  const head=`<header><span class="eyebrow">Karteikarten · ${esc(D.title)}</span><h1>Karteikarten</h1></header>
   <section class="card"><div class="row" id="dk">${decks.map(d=>{ const k=knownMap(d.id), n=d.cards.filter(c=>k[c[0]]==='ok').length; return `<button class="chip" type="button" data-deck="${d.id}" aria-pressed="${d.id===D.id}">${d.id==='std'?'📚 ':'📇 '}${esc(d.title)} <span class="muted" style="font-size:.8em">${n}/${d.cards.length}</span></button>`; }).join('')}<button class="chip" type="button" id="dk-new">➕ Neu mit Alki</button></div>
   ${NEWDECK?`<form class="chat-in" id="dk-form" style="margin-top:12px"><label for="dk-topic" class="sr">Thema</label><input id="dk-topic" class="inp" maxlength="120" placeholder="Thema, z. B. homologe Reihe der Alkane" autocomplete="off"><button class="btn primary" type="submit" ${DECK_BUSY?'disabled':''}>${DECK_BUSY?'Erstelle …':'Erstellen'}</button></form>${DECK_BUSY?'<p class="muted" style="margin:8px 0 0;font-size:.88rem">Alki erstellt deine Karteikarten, das dauert ein paar Sekunden …</p>':''}`:''}</section>`;
  if(!deck.length){
    app.innerHTML=head+`<section class="card"><div class="score">${sure}/${C.length}</div><p>Runde fertig. Alle Karten einmal geschafft.</p><div class="row"><button class="btn primary" type="button" id="cd-again">Neue Runde</button><button class="btn" type="button" id="cd-reset">Fortschritt zurücksetzen</button><button class="btn" type="button" id="dk-edit">✏️ Karten bearbeiten</button></div></section>`;
    $('#cd-again').addEventListener('click',()=>{ deck=null; viewCards(); });
    $('#cd-reset').addEventListener('click',()=>{ Object.keys(K).forEach(k=>delete K[k]); save(); deck=null; viewCards(); });
  } else {
    const c=deck[0];
    app.innerHTML=head+`<p class="muted" style="margin:0;font-size:.88rem">${sure} von ${C.length} sicher · noch ${deck.length} in dieser Runde</p>
     <button class="flash" type="button" id="cd-card" aria-live="polite">${flipped?`<span class="eyebrow">${show(c[0])}</span><span class="def">${show(c[1])}</span>`:`<span class="term">${show(c[0])}</span><span class="tap">Antippen zum Umdrehen</span>`}</button>
     <div class="row" style="justify-content:center"><button class="btn" type="button" id="cd-no" style="flex:1">Nochmal</button><button class="btn primary" type="button" id="cd-ok" style="flex:1">Wusste ich</button></div>
     <p class="muted" style="font-size:.88rem;text-align:center;margin:0">Erst selbst laut sagen, dann umdrehen. Ehrlich bewerten.</p>
     <div class="row" style="justify-content:center"><button class="btn small" type="button" id="cd-del">${DEL_CARD?(isStd?'Wirklich ausblenden?':'Wirklich löschen?'):(isStd?'🙈 Karte ausblenden':'🗑️ Karte löschen')}</button><button class="btn small" type="button" id="dk-edit">✏️ Karten bearbeiten</button></div>`;
    $('#cd-card').addEventListener('click',()=>{ flipped=!flipped; viewCards(); });
    $('#cd-ok').addEventListener('click',()=>{ K[c[0]]='ok'; save(); deck.shift(); flipped=false; viewCards(); });
    $('#cd-no').addEventListener('click',()=>{ K[c[0]]='no'; save(); deck.shift(); deck.splice(Math.min(3,deck.length),0,c); flipped=false; viewCards(); });
    $('#cd-del').addEventListener('click',()=>{ if(!DEL_CARD){ DEL_CARD=true; viewCards(); setTimeout(()=>{ if(DEL_CARD){ DEL_CARD=false; if(location.hash==='#karten') viewCards(); } },4000); return; }
      DEL_CARD=false; removeCard(D.id,c[0]); deck.shift(); flipped=false; toast(isStd?'Karte ausgeblendet':'Karte gelöscht'); viewCards(); });
  }
  if(EDIT_DECK) app.insertAdjacentHTML('beforeend',editHTML(D,isStd));
  if(!isStd&&!EDIT_DECK) app.insertAdjacentHTML('beforeend',`<div class="row" style="justify-content:space-between"><span class="muted" style="font-size:.82rem">${(S.decks.find(d=>d.id===D.id)||{}).ai===false?'Aus dem Lernstoff der App erstellt':'Von Alki erstellt'} · ${C.length} Karten</span><button class="btn small" type="button" id="dk-del">${DEL_DECK?'Wirklich löschen?':'Stapel löschen'}</button></div>`);
  const ed=$('#dk-edit'); if(ed) ed.addEventListener('click',()=>{ EDIT_DECK=!EDIT_DECK; viewCards(); if(EDIT_DECK){ const x=$('#dk-editbox'); if(x) x.scrollIntoView({behavior:'smooth'}); } });
  $('#dk-new').addEventListener('click',()=>{ NEWDECK=!NEWDECK; viewCards(); const i=$('#dk-topic'); if(i) i.focus(); });
  const f=$('#dk-form'); if(f) f.addEventListener('submit',async e=>{ e.preventDefault(); const t=$('#dk-topic').value.trim(); if(!t||DECK_BUSY) return; DECK_BUSY=true; viewCards();
    const d=await makeDeck(t); DECK_BUSY=false; if(!d){ toast('Dazu konnte ich keine Karten erstellen'); viewCards(); return; } NEWDECK=false; toast(`${d.cards.length} Karteikarten erstellt`); openDeck(d.id); });
  const del=$('#dk-del'); if(del) del.addEventListener('click',()=>{ if(!DEL_DECK){ DEL_DECK=true; viewCards(); setTimeout(()=>{ if(DEL_DECK){ DEL_DECK=false; if(location.hash==='#karten') viewCards(); } },4000); return; }
    S.decks=S.decks.filter(d=>d.id!==D.id); if(S.deckKnown) delete S.deckKnown[D.id]; save(); DEL_DECK=false; openDeck('std'); });
}
function viewTasks(){
  app.innerHTML=`<header><span class="eyebrow">Wie in der Klausur</span><h1>Aufgaben</h1></header>
   <section class="card"><div class="sec-label">Operatoren</div><ul style="margin:0">
   <li><b>Nenne</b>: aufzählen, ohne Begründung</li><li><b>Beschreibe</b>: in ganzen Sätzen wiedergeben, was passiert</li><li><b>Erkläre / Begründe</b>: mit Fachbegriffen den Grund angeben (weil …, je … desto …)</li><li><b>Zeichne</b>: Formel vollständig und sauber, mit allen H-Atomen, wenn Strukturformel verlangt ist</li></ul></section>
   <p class="muted" style="margin:0">Schreib deine Antwort zuerst auf Papier oder in GoodNotes. Dann Lösung aufdecken und vergleichen.</p>
   ${TASKS.map((t,i)=>`<section class="card task"><div class="eyebrow">Aufgabe ${i+1} · Thema ${t.t}</div><p style="font-size:1.05rem">${t.q}</p><button class="btn small" type="button" data-sol="${i}">Lösung zeigen</button><div class="sol" id="sol-${i}" hidden></div>
   <div class="rate" data-rate="${i}"><span class="muted" style="font-size:.85rem;align-self:center">Wie lief's?</span>${[['g','Konnte ich'],['m','Teilweise'],['b','Noch nicht']].map(([k,l])=>`<button class="chip ${k}" type="button" data-k="${k}" aria-pressed="${S.tasks[i]===k}">${l}</button>`).join('')}</div></section>`).join('')}`;
  app.addEventListener('click',taskClick);
}
function taskClick(e){
  if(!location.hash.startsWith('#aufgaben')) return;
  const s=e.target.closest('[data-sol]');
  if(s){ const i=+s.dataset.sol, box=$('#sol-'+i); if(box.hidden){ box.innerHTML=TASKS[i].sol(); box.hidden=false; s.textContent='Lösung verbergen'; } else { box.hidden=true; s.textContent='Lösung zeigen'; } return; }
  const r=e.target.closest('.rate [data-k]');
  if(r){ const grp=r.closest('[data-rate]'); const i=+grp.dataset.rate; S.tasks[i]=r.dataset.k; save(); grp.querySelectorAll('[data-k]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===S.tasks[i])); }
}

/* ---------- Routing ---------- */
function route(){
  app.removeEventListener('click',taskClick);
  leaveBattleIfAway(); clearInterval(B.timer);
  const h=(location.hash||'#start').slice(1);
  let nav='start';
  if(h.startsWith('thema-')){ viewTopic(+h.split('-')[1]); nav='start'; }
  else if(h==='klausur'){ viewExam(); nav='klausur'; }
  else if(h==='karten'){ deck=null; flipped=false; NEWDECK=false; viewCards(); nav='karten'; }
  else if(h==='aufgaben'){ viewTasks(); nav='aufgaben'; }
  else if(h==='spick'){ viewSpick(); nav='start'; }
  else if(h==='training'){ viewTrain(); nav='training'; }
  else if(h==='zuordnen'){ viewMatch(); nav='training'; }
  else if(h==='battle'){ viewBattle(); nav='battle'; }
  else if(h==='shop'){ viewShop(); nav='battle'; }
  else viewStart();
  document.querySelectorAll('[data-nav]').forEach(a=>a.toggleAttribute('aria-current',false));
  const cur=document.querySelector(`[data-nav="${nav}"]`); if(cur) cur.setAttribute('aria-current','page');
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
app.addEventListener('click',battleClick);
app.addEventListener('input',e=>{ if(e.target.id==='b-name'){ S.name=e.target.value.trim().slice(0,16); save(); clearTimeout(B.nameT); B.nameT=setTimeout(()=>bSend(helloMsg()),800); } });
route();
</script>

</body>
