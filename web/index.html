<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121817">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alkane">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
/* Platz für Statusleiste und Home-Balken, wenn die App im Vollbild läuft */
:root{padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg,#121817)}
</style>
<script>
if (location.protocol === 'https:' && /onrender\.com$/.test(location.hostname) && 'serviceWorker' in navigator) {
  addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
</head>
<body>
<title>Alkane Klausurtrainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: Schulheft auf Karopapier – eine Lesespalte, Themen als Kapitel, feste Navigationsleiste unten */
:root{
  --bg:#e8edeb; --grid:rgba(30,70,60,.075); --paper:#fbfcfc; --paper-2:#f1f4f3;
  --ink:#16201e; --muted:#566461; --line:#cbd5d2;
  --accent:#bb4f17; --accent-soft:rgba(187,79,23,.11); --on-accent:#ffffff;
  --plus:#1d5ea5; --minus:#bd3131;
  --good:#2a7849; --good-soft:rgba(42,120,73,.12); --bad:#b5322d; --bad-soft:rgba(181,50,45,.10);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121817; --grid:rgba(200,230,220,.055); --paper:#1a2221; --paper-2:#212b29;
    --ink:#e6ecea; --muted:#97a6a2; --line:#2d3936;
    --accent:#f08a4b; --accent-soft:rgba(240,138,75,.14); --on-accent:#1a0e06;
    --plus:#73aaea; --minus:#f07c7c;
    --good:#62c98f; --good-soft:rgba(98,201,143,.13); --bad:#f07c7c; --bad-soft:rgba(240,124,124,.12);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121817; --grid:rgba(200,230,220,.055); --paper:#1a2221; --paper-2:#212b29;
  --ink:#e6ecea; --muted:#97a6a2; --line:#2d3936;
  --accent:#f08a4b; --accent-soft:rgba(240,138,75,.14); --on-accent:#1a0e06;
  --plus:#73aaea; --minus:#f07c7c;
  --good:#62c98f; --good-soft:rgba(98,201,143,.13); --bad:#f07c7c; --bad-soft:rgba(240,124,124,.12);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background-color:var(--bg); color:var(--ink);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  font-family:var(--f-body); font-size:17px; line-height:1.55;
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:720px; margin:0 auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); padding-block:20px 120px; display:flex; flex-direction:column; gap:18px}
h1,h2,h3{font-family:var(--f-display); line-height:1.15; text-wrap:balance; margin:0}
h1{font-size:2.1rem; font-weight:800; letter-spacing:-.01em}
h2{font-size:1.35rem; font-weight:800}
h3{font-size:1.1rem; font-weight:600; margin-top:1.1em}
p{margin:.55em 0} ul,ol{margin:.5em 0; padding-left:1.3em} li{margin:.25em 0}
sub{font-size:.72em; line-height:0}
b{font-weight:700}
.eyebrow{font-family:var(--f-mono); font-size:.75rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}
.plus{color:var(--plus)} .minus{color:var(--minus)}
.card{background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:18px; min-width:0}
.card > :first-child{margin-top:0}
.prose{max-width:65ch}
.hint{font-size:.92rem; color:var(--muted); border-top:1px dashed var(--line); padding-top:.6em}
.merk{border:1.5px dashed var(--accent); border-radius:10px; padding:12px 14px; margin:.9em 0; position:relative; background:var(--accent-soft)}
.merk-label{display:block; font-family:var(--f-mono); font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); font-weight:600; margin-bottom:2px}
.formula-big{font-family:var(--f-mono); font-size:2rem; font-weight:600; text-align:center; padding:8px 0; color:var(--accent)}
.tbl{overflow-x:auto; margin:.7em 0}
table{border-collapse:collapse; width:100%; font-size:.95rem; font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line); padding:7px 8px; text-align:left; vertical-align:top}
th{font-family:var(--f-mono); font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible, input:focus-visible, select:focus-visible{outline:2.5px solid var(--accent); outline-offset:2px}
.btn{color:var(--ink); border:1px solid var(--line); background:var(--paper-2); border-radius:10px; padding:10px 14px; font-weight:700}
.btn.primary{background:var(--accent); color:var(--on-accent); border-color:var(--accent)}
.btn.small{padding:6px 10px; font-size:.88rem}
.row{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.chip{border:1px solid var(--line); background:var(--paper); border-radius:999px; padding:6px 12px; font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.fig{display:block; margin:0 auto; max-width:100%; height:auto}
.figbox{overflow-x:auto; padding:6px 0}
svg text{fill:var(--ink)}
.sk-main{stroke:var(--ink); stroke-width:2.6; fill:none; stroke-linecap:round; stroke-linejoin:round}
.sk-sub{stroke:var(--accent); stroke-width:2.6; fill:none; stroke-linecap:round; stroke-linejoin:round}
.sk-dot{fill:var(--ink)} .sk-dot.s{fill:var(--accent)}
.sk-num{font-family:var(--f-mono); font-size:10px; fill:var(--muted)!important}
.st-bond{stroke:var(--ink); stroke-width:1.6}
.st-atom{font-family:var(--f-mono); font-size:15px; font-weight:600}
.st-h{fill:var(--muted)!important; font-weight:400}
.hs-t{font-family:var(--f-mono); font-size:15px; font-weight:600; fill:var(--ink)}
.hs-s{font-size:10px}
.hs-b{stroke:var(--ink); stroke-width:1.5}
.kopt .hs-t{fill:#fff} .kopt .hs-b{stroke:#fff}

/* Kopf */
.hero{display:flex; flex-direction:column; gap:10px; padding-top:6px}
.hero h1{font-size:2.7rem}
.hero .date{font-family:var(--f-mono); font-size:.9rem}
.count{display:flex; gap:18px; flex-wrap:wrap; align-items:flex-end}
.count .num{font-family:var(--f-display); font-weight:800; font-size:2.4rem; line-height:1; color:var(--accent); font-variant-numeric:tabular-nums}
.count .lbl{font-size:.85rem; color:var(--muted)}
.cd-box{background:var(--paper); border:1.5px solid var(--ink); border-radius:14px; padding:14px 16px; display:flex; flex-direction:column; gap:8px}
.cd{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.cd-unit{display:flex; flex-direction:column; align-items:flex-start; min-width:0}
.cd-unit .num{font-family:var(--f-display); font-weight:800; font-size:clamp(2.2rem,11vw,3.4rem); line-height:1; color:var(--accent); font-variant-numeric:tabular-nums}
.cd-unit .lbl{font-size:.85rem; color:var(--muted)}
.progress{height:8px; background:var(--paper-2); border:1px solid var(--line); border-radius:99px; overflow:hidden}
.progress > span{display:block; height:100%; background:var(--good); transition:width .4s}

/* Themenliste */
.topics{display:flex; flex-direction:column; gap:0}
.topic-row{display:grid; grid-template-columns:42px 1fr auto; gap:12px; align-items:center; padding:12px 4px; border-bottom:1px solid var(--line); background:none; border-left:0; border-right:0; border-top:0; text-align:left; width:100%}
.topic-row:last-child{border-bottom:0}
.tnum{width:38px; height:38px; border-radius:9px; border:1.5px solid var(--ink); display:grid; place-items:center; font-family:var(--f-display); font-weight:800; font-size:1.1rem}
.topic-row.done .tnum{background:var(--good); border-color:var(--good); color:var(--paper)}
.topic-row .tt{font-weight:700; line-height:1.25; min-width:0}
.topic-row .ts{font-size:.85rem; color:var(--muted); line-height:1.3}
.topic-row .arrow{color:var(--muted); font-family:var(--f-mono)}
.plan{display:flex; flex-direction:column; gap:12px}
.block{display:grid; grid-template-columns:86px 1fr; gap:12px; align-items:start}
.block .when{font-family:var(--f-mono); font-size:.78rem; color:var(--muted); line-height:1.35; padding-top:3px}
.block .when b{display:block; color:var(--ink); font-size:.85rem}
.block .what{min-width:0; display:flex; flex-wrap:wrap; gap:6px}
.pill{border:1px solid var(--line); border-radius:8px; padding:4px 9px; font-size:.88rem; background:var(--paper-2)}
.pill.done{border-color:var(--good); color:var(--good); background:var(--good-soft)}
.pill.done::before{content:"✓ "}
a.pill{color:inherit; text-decoration:none}

/* Thema */
.topbar{display:flex; justify-content:space-between; align-items:center; gap:10px}
.back{background:none; border:0; padding:6px 0; font-weight:700; color:var(--accent)}
.goals{font-size:.95rem; margin:0}
.sec-label{font-family:var(--f-mono); font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); font-weight:600; margin-bottom:8px}
.pager{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap}

/* Widgets */
.w-out{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-top:12px}
.stat{background:var(--paper-2); border-radius:10px; padding:10px 12px; min-width:0}
.stat .k{font-size:.72rem; font-family:var(--f-mono); text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}
.stat .v{font-weight:700; font-size:1.15rem; font-variant-numeric:tabular-nums; overflow-wrap:anywhere}
.stat .v.mono{font-family:var(--f-mono); font-weight:600}
input[type=range]{width:100%; accent-color:var(--accent)}
select{font:inherit; padding:8px 10px; border-radius:9px; border:1px solid var(--line); background:var(--paper); color:var(--ink)}
.name-out{font-family:var(--f-display); font-weight:800; font-size:1.5rem; overflow-wrap:anywhere; line-height:1.2}
.warn{color:var(--bad); background:var(--bad-soft); border-radius:9px; padding:8px 12px; font-size:.92rem}
.okmsg{color:var(--good); background:var(--good-soft); border-radius:9px; padding:8px 12px; font-size:.92rem; font-weight:700}
.subs-list{display:flex; flex-wrap:wrap; gap:6px}
.subchip{display:inline-flex; gap:6px; align-items:center; border:1px solid var(--accent); color:var(--accent); border-radius:99px; padding:3px 4px 3px 10px; font-size:.88rem}
.subchip button{border:0; background:var(--accent-soft); color:var(--accent); width:24px; height:24px; border-radius:99px; line-height:1}
.iso-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px; margin-top:12px}
.iso{background:var(--paper-2); border-radius:10px; padding:10px; display:flex; flex-direction:column; gap:6px; min-width:0}
.iso .nm{font-weight:700; overflow-wrap:anywhere}
.bar{height:6px; border-radius:6px; background:var(--accent)}
.en-scale{position:relative; height:34px; margin:20px 0 6px}
.en-zone{position:absolute; top:0; height:14px; display:flex; align-items:center; justify-content:center}
.en-marker{position:absolute; top:-8px; width:3px; height:30px; background:var(--ink); border-radius:2px; transition:left .35s}
.en-ticks{position:absolute; top:18px; left:0; right:0; font-family:var(--f-mono); font-size:.72rem; color:var(--muted)}
.en-ticks span{position:absolute; transform:translateX(-50%)}
.bond-view{display:flex; justify-content:center; align-items:center; gap:4px; padding:18px 0 6px; font-family:var(--f-mono)}
.bond-view .at{display:flex; flex-direction:column; align-items:center; min-width:54px}
.bond-view .at .d{font-size:1rem; height:1.4em; font-weight:600}
.bond-view .at .s{font-size:2.2rem; font-weight:600; line-height:1}
.bond-view .line{width:60px; height:4px; background:var(--ink); border-radius:2px; margin-top:22px}
.force{display:grid; grid-template-columns:24px 1fr auto; gap:8px; align-items:center; padding:7px 0; border-bottom:1px solid var(--line)}
.force:last-child{border-bottom:0}
.force .ic{font-weight:800; text-align:center}
.force.on .ic{color:var(--good)} .force.off{color:var(--muted)}
.vdw-svg .cloud{transition:transform .6s ease; transform-box:fill-box}
.vdw-svg .lbl{transition:opacity .4s}
.order-pool{display:flex; flex-direction:column; gap:8px; margin-top:10px}
.order-pool button{text-align:left; border:1px solid var(--line); background:var(--paper-2); border-radius:10px; padding:10px 12px}
.order-done{display:flex; flex-direction:column; gap:4px; margin-top:10px}
.order-done div{padding:6px 12px; border-left:3px solid var(--good); background:var(--good-soft); border-radius:0 8px 8px 0}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.notation{display:grid; grid-template-columns:1fr; gap:10px; margin-top:12px}
@media (min-width:620px){ .notation{grid-template-columns:1fr 1fr} }
.chart-info{min-height:2.8em; font-size:.95rem}

/* Münzen, Shop */
.coins{display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:99px; background:var(--paper); border:1.5px solid var(--accent); color:var(--ink); text-decoration:none; font-variant-numeric:tabular-nums}
.toast{position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,20px); opacity:0; background:var(--ink); color:var(--paper); padding:9px 16px; border-radius:99px; font-size:.95rem; z-index:40; pointer-events:none; transition:opacity .25s, transform .25s; white-space:nowrap}
.toast.show{opacity:1; transform:translate(-50%,0)}
.av-big{font-size:2.6rem; line-height:1}
.shop{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px; margin-top:12px}
.sitem{display:flex; flex-direction:column; align-items:center; justify-content:space-between; gap:8px; padding:12px 8px; border:1px solid var(--line); border-radius:12px; background:var(--paper-2); text-align:center; min-height:120px}
.sitem.own{border-color:var(--good)}
.semoji{font-size:2.4rem; line-height:1.1}
.stitle{font-family:var(--f-display); font-weight:800; font-size:1rem; line-height:1.2; overflow-wrap:break-word; hyphens:auto}
.inp{font:inherit; width:100%; padding:10px 12px; border-radius:10px; border:1.5px solid var(--line); background:var(--paper); color:var(--ink); margin-top:4px}
.btn.big{padding:14px; font-size:1.05rem}
/* Chat-Bot */
.bot{display:flex; flex-direction:column; gap:12px}
.bot-av{font-size:2rem; line-height:1; width:48px; height:48px; display:grid; place-items:center; border-radius:14px; background:var(--accent-soft)}
.chat{display:flex; flex-direction:column; gap:8px; max-height:60vh; overflow-y:auto; padding:2px}
.msg{max-width:88%; padding:10px 13px; border-radius:14px; line-height:1.45; font-size:.97rem; overflow-wrap:break-word}
.msg p{margin:.25em 0} .msg ul{margin:.3em 0; padding-left:1.2em} .msg li{margin:.15em 0}
.msg.user{align-self:flex-end; background:var(--accent); color:var(--on-accent); border-bottom-right-radius:4px; white-space:pre-wrap}
.msg.bot{align-self:flex-start; background:var(--paper-2); border:1px solid var(--line); border-bottom-left-radius:4px}
.msg.typing{display:flex; flex-direction:row; flex-wrap:nowrap; align-items:center; justify-content:center; gap:5px; width:66px; min-width:66px; height:40px; padding:0}
.typing span{display:block; flex:0 0 7px; width:7px; height:7px; border-radius:50%; background:var(--muted); animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s} .typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.chat-in{display:flex; gap:8px; align-items:center}
.chat-in .inp{margin:0; flex:1; min-width:0}
.xlink{align-self:flex-start; border:0; background:none; color:var(--muted); font-size:.85rem; padding:0; text-decoration:underline}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
/* Freunde */
.flist{display:flex; flex-direction:column; margin-top:6px}
.frow{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow .av{font-size:1.7rem; line-height:1}
.frow .fn{display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.frow .ft{font-size:.78rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:middle; background:var(--line)}
.dot.online{background:#2fbf5b} .dot.battle{background:#e0a21f}
.xbtn{border:0; background:none; color:var(--muted); font-size:1.3rem; padding:4px 6px; line-height:1}
.popup{position:fixed; left:max(12px,env(safe-area-inset-left,0px)); right:max(12px,env(safe-area-inset-right,0px)); bottom:calc(78px + env(safe-area-inset-bottom,0px)); z-index:50; background:var(--paper); border:2px solid var(--accent); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:12px; box-shadow:0 10px 30px rgba(0,0,0,.25); transform:translateY(160%); transition:transform .3s; max-width:520px; margin:0 auto}
.popup.show{transform:none}
.pop-in{display:flex; align-items:center; gap:12px}
.pop-in .av{font-size:2.2rem; line-height:1}
/* Update-Hinweis */
.adm-sheet{position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; justify-content:center; padding:12px; padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.adm-box{width:100%; max-width:520px; max-height:88vh; overflow:auto; display:flex; flex-direction:column; gap:8px; margin:0}
.upd{position:fixed; top:calc(10px + env(safe-area-inset-top,0px)); left:max(12px,env(safe-area-inset-left,0px)); right:max(12px,env(safe-area-inset-right,0px)); max-width:560px; margin:0 auto; z-index:70; display:flex; align-items:center; gap:10px; background:var(--paper); border:2px solid var(--accent); border-radius:14px; padding:10px 12px; box-shadow:0 8px 24px rgba(0,0,0,.25); animation:updin .35s ease-out}
@keyframes updin{from{transform:translateY(-120%)}to{transform:none}}
/* Karten bearbeiten */
.elist{display:flex; flex-direction:column; gap:8px; margin-top:10px; max-height:60vh; overflow-y:auto}
.erow{display:flex; gap:8px; align-items:flex-start; padding:8px; border-radius:10px; background:var(--paper-2)}
.erow .etxt{display:flex; flex-direction:column; gap:4px; min-width:0; flex:1; font-size:.9rem}
.erow .etxt .inp{margin:0; padding:7px 9px; font-size:.92rem; resize:vertical}
.erow.hid{opacity:.45}
/* Spielstand */
.savecode{font-family:var(--f-mono); font-weight:600; font-size:1.4rem; letter-spacing:.08em; color:var(--accent)}
/* Bots */
.botrow{display:flex; flex-direction:column; gap:6px}
.botlv{color:var(--muted); font-weight:400; font-size:.8em}
/* Team-Battle */
.tcols{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.tcol{display:flex; flex-direction:column; gap:6px; min-width:0}
.tcol.t0{border-top:4px solid var(--k0)} .tcol.t1{border-top:4px solid var(--k1)}
.tname{font-family:var(--f-display); font-weight:800; font-size:.95rem}
.tmem{display:flex; align-items:center; gap:6px; padding:6px 8px; border-radius:10px; background:var(--paper-2); min-width:0}
.tmem .av{font-size:1.3rem; line-height:1}

<script>
"use strict";
/* ---------- Speicher ---------- */
const KEY='alkane-klausur-v1';
let S={done:{},cards:{},tasks:{},exams:[],wrong:{},theme:'system',hunt:{}};
try{ const raw=localStorage.getItem(KEY); if(raw){ S=Object.assign(S,JSON.parse(raw)); } }catch(e){}
function save(noCloud){ S.savedAt=Date.now(); try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} if(!noCloud&&typeof cloudSoon==='function') cloudSoon(); }
const THEMES={system:'Automatisch',light:'Hell',dark:'Dunkel'};
let themeTouched=false;
function applyTheme(){ const r=document.documentElement; if(S.theme==='system'){ if(themeTouched) r.removeAttribute('data-theme'); } else { r.setAttribute('data-theme',S.theme); themeTouched=true; } }
applyTheme();

/* ---------- Helfer ---------- */
const $=(s,r=document)=>r.querySelector(s);
const fm=s=>String(s).replace(/([A-Za-z\)])(\d+)/g,'$1<sub>$2</sub>');
const dec=x=>String(x).replace('.',',');
const shuffle=a=>{a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;};
const randInt=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }

/* ---------- Chemie-Engine: Moleküle, Namen, Formeln ---------- */
const STEMS=['','meth','eth','prop','but','pent','hex','hept','oct','non','dec'];
const ALKYL={1:'methyl',2:'ethyl',3:'propyl'};
const MULT=['','','di','tri','tetra'];
const ALKANES=[null,
 {n:1,name:'Methan',bp:-162},{n:2,name:'Ethan',bp:-89},{n:3,name:'Propan',bp:-42},{n:4,name:'Butan',bp:-0.5},
 {n:5,name:'Pentan',bp:36},{n:6,name:'Hexan',bp:69},{n:7,name:'Heptan',bp:98},{n:8,name:'Octan',bp:126},
 {n:9,name:'Nonan',bp:151},{n:10,name:'Decan',bp:174}];
function cap(s){ return s.replace(/[a-zäöü]/,c=>c.toUpperCase()); }
function locs(m,flip){ return m.subs.map(s=>({l:s.l,p:flip?m.n+1-s.p:s.p})); }
function cmpArr(a,b){ for(let i=0;i<Math.min(a.length,b.length);i++){ if(a[i]!==b[i]) return a[i]-b[i]; } return 0; }
function chooseFlip(m){
  const A=locs(m,false), B=locs(m,true);
  const sa=A.map(x=>x.p).sort((x,y)=>x-y), sb=B.map(x=>x.p).sort((x,y)=>x-y);
  let c=cmpArr(sa,sb); if(c<0) return false; if(c>0) return true;
  const ord=L=>L.slice().sort((x,y)=>ALKYL[x.l].localeCompare(ALKYL[y.l])||x.p-y.p).map(x=>x.p);
  return cmpArr(ord(A),ord(B))>0;
}
function buildName(n,L,reverseOrder,noMult){
  if(!L.length) return cap(STEMS[n]+'an');
  let parts;
  if(noMult){
    parts=L.slice().sort((x,y)=>ALKYL[x.l].localeCompare(ALKYL[y.l])||x.p-y.p).map(x=>x.p+'-'+ALKYL[x.l]);
  }else{
    const g={}; L.forEach(x=>{(g[x.l]=g[x.l]||[]).push(x.p);});
    let keys=Object.keys(g).sort((a,b)=>ALKYL[a].localeCompare(ALKYL[b]));
    if(reverseOrder) keys.reverse();
    parts=keys.map(k=>{const ps=g[k].sort((a,b)=>a-b); return ps.join(',')+'-'+MULT[ps.length]+ALKYL[k];});
  }
  return cap(parts.join('-')+STEMS[n]+'an');
}
function nameOf(m){ return buildName(m.n,locs(m,chooseFlip(m))); }
function carbons(m){ return m.n+m.subs.reduce((a,s)=>a+s.l,0); }
function sumFormula(m){ const c=carbons(m); return 'C'+(c>1?c:'')+'H'+(2*c+2); }
function longestChain(m){
  const adj=[]; let id=m.n;
  const add=(a,b)=>{(adj[a]=adj[a]||[]).push(b);(adj[b]=adj[b]||[]).push(a);};
  for(let i=0;i<m.n;i++){ adj[i]=adj[i]||[]; if(i>0) add(i-1,i); }
  m.subs.forEach(s=>{ let prev=s.p-1; for(let k=0;k<s.l;k++){ add(prev,id); prev=id; id++; } });
  const far=st=>{ const d=new Array(id).fill(-1); d[st]=0; const q=[st]; let best=st;
    while(q.length){ const u=q.shift(); for(const v of adj[u]) if(d[v]<0){ d[v]=d[u]+1; q.push(v); if(d[v]>d[best]) best=v; } }
    return [best,d[best]]; };
  const [a]=far(0); return far(a)[1]+1;
}
function validate(m){
  const cnt={};
  for(const s of m.subs){
    if(s.p<=1||s.p>=m.n) return 'Am Kettenende darf keine Seitenkette sitzen: Sie würde die Hauptkette einfach verlängern.';
    cnt[s.p]=(cnt[s.p]||0)+1;
    if(cnt[s.p]>2) return 'Ein C-Atom in der Kette hat nur noch 2 freie Bindungen. Mehr als 2 Seitenketten passen nicht dran.';
  }
  if(longestChain(m)>m.n) return 'Über diese Seitenkette entsteht eine längere Kette als die Hauptkette. Die längste Kette muss immer die Hauptkette sein. Setze die Seitenkette weiter in die Mitte.';
  return null;
}
function condensed(m){
  const by={}; m.subs.forEach(s=>(by[s.p]=by[s.p]||[]).push(s));
  const parts=[];
  for(let i=1;i<=m.n;i++){
    const subs=by[i]||[]; const nb=m.n===1?0:(i===1||i===m.n?1:2);
    const h=4-nb-subs.length;
    let t='C'+(h>0?'H'+(h>1?h:''):'');
    const g={}; subs.forEach(s=>g[s.l]=(g[s.l]||0)+1);
    Object.keys(g).forEach(l=>{ const grp=l==1?'CH3':l==2?'CH2CH3':'CH2CH2CH3'; t+= g[l]>1?'('+grp+')'+g[l]:'('+grp+')'; });
    parts.push(t);
  }
  return parts.join('–');
}
/* Halbstrukturformel wie im Heft: Hauptkette waagerecht, Seitenketten mit Strichen nach oben/unten */
function halb(m,opt={}){
  if(!m.subs.length) return `<span class="mono">${fm(condensed(m))}</span>`;
  const by={}; m.subs.forEach(s=>(by[s.p]=by[s.p]||[]).push(s));
  const mainLab=i=>{ const nb=(i===1||i===m.n)?1:2; const h=4-nb-(by[i]||[]).length; return h>0?'CH'+(h>1?h:''):'C'; };
  const w=l=>l.replace(/\d/g,'').length*9.2+(/\d/.test(l)?6.5:0);
  const T=(x,y,l)=>`<text class="hs-t" x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central">${l.replace(/(\d)/,'<tspan class="hs-s" dy="4">$1</tspan>')}</text>`;
  const L=(x1,y1,x2,y2)=>`<line class="hs-b" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
  let up=0,down=0; Object.values(by).forEach(list=>list.forEach((s,j)=>{ if(j===0) up=Math.max(up,s.l); else down=Math.max(down,s.l); }));
  const CW=48, RH=30, W=m.n*CW, H=(up+down+1)*RH, y0=up*RH+RH/2, cx=i=>(i-0.5)*CW;
  let out='';
  for(let i=1;i<=m.n;i++){ const l=mainLab(i); out+=T(cx(i),y0,l);
    if(i<m.n){ const r=mainLab(i+1); out+=L(cx(i)+w(l)/2+4,y0,cx(i+1)-w(r)/2-4,y0); } }
  Object.keys(by).forEach(pk=>{ const i=+pk; by[i].forEach((s,j)=>{ const d=j===0?-1:1; let py=y0;
    for(let k=1;k<=s.l;k++){ const y=y0+d*k*RH, l=k<s.l?'CH2':'CH3'; out+=L(cx(i),py+d*9,cx(i),y-d*9)+T(cx(i),y,l); py=y; } }); });
  const sc=opt.scale||1.2;
  return `<svg class="fig hs" viewBox="0 0 ${W} ${H}" width="${Math.round(W*sc)}" role="img" aria-label="Halbstrukturformel ${condensed(m)}">${out}</svg>`;
}
/* Skelettformel als SVG */
function skeletonSVG(m,opt={}){
  if(m.n===1) return '<p class="muted" style="text-align:center">Methan hat nur ein C-Atom. Eine Skelettformel ist hier nicht üblich.</p>';
  if(opt.flip) m={n:m.n,subs:m.subs.map(s=>({p:m.n+1-s.p,l:s.l}))};
  const L=30, dx=26, dy=15;
  const P=[]; for(let i=1;i<=m.n;i++) P[i]={x:(i-1)*dx, y:(i%2? dy:0)};
  const outDir=i=> P[i].y===0? -1 : 1;
  const all=P.slice(1).map(p=>({x:p.x,y:p.y}));
  const by={}; m.subs.forEach(s=>(by[s.p]=by[s.p]||[]).push(s));
  let subPaths=[], subDots=[];
  Object.keys(by).forEach(pk=>{
    const p=+pk; const list=by[p].slice().sort((a,b)=>b.l-a.l);
    list.forEach((s,j)=>{
      const dir= j===0? outDir(p) : -outDir(p);
      let side = p<=m.n/2? 1:-1;
      let x=P[p].x, y=P[p].y; const pts=[[x,y]];
      for(let k=1;k<=s.l;k++){
        if(k%2===1){ y+=dir*L; } else { x+=side*dx; y+=dir*dy; }
        pts.push([x,y]); all.push({x,y}); subDots.push([x,y]);
      }
      subPaths.push('M'+pts.map(q=>q.join(',')).join(' L'));
    });
  });
  const pad=18;
  const xs=all.map(a=>a.x), ys=all.map(a=>a.y);
  const minx=Math.min(...xs)-pad, maxx=Math.max(...xs)+pad, miny=Math.min(...ys)-pad, maxy=Math.max(...ys)+pad;
  const w=maxx-minx, h=maxy-miny, sc=opt.scale||1.7;
  let s=`<svg class="fig" viewBox="${minx} ${miny} ${w} ${h}" width="${Math.round(w*sc)}" role="img" aria-label="Skelettformel">`;
  s+=`<path class="sk-main" d="M${P.slice(1).map(p=>p.x+','+p.y).join(' L')}"/>`;
  subPaths.forEach(d=>s+=`<path class="sk-sub" d="${d}"/>`);
  if(opt.dots){
    P.slice(1).forEach(p=>s+=`<circle class="sk-dot" cx="${p.x}" cy="${p.y}" r="2.6"/>`);
    subDots.forEach(q=>s+=`<circle class="sk-dot s" cx="${q[0]}" cy="${q[1]}" r="2.6"/>`);
  }
  if(opt.nums){
    for(let i=1;i<=m.n;i++){
      const inward=-outDir(i); const hasTwo=(by[i]||[]).length>1;
      const tx=P[i].x+(hasTwo?9:0), ty=P[i].y+inward*12+(inward>0?3:0);
      s+=`<text class="sk-num" x="${tx}" y="${ty}" text-anchor="middle">${i}</text>`;
    }
  }
  return s+'</svg>';
}
/* Strukturformel (Lewis/Valenzstrich) als SVG – für unverzweigte und einfache verzweigte Alkane */
function structSVG(m){
  const C=26; const main=[], carb=[], bonds=[];
  for(let i=0;i<m.n;i++){ const a={x:2*i,y:0,used:new Set(),c:true}; main.push(a); carb.push(a); if(i>0){ bonds.push([main[i-1],a]); main[i-1].used.add('R'); a.used.add('L'); } }
  const by={}; m.subs.forEach(s=>(by[s.p]=by[s.p]||[]).push(s));
  Object.keys(by).forEach(pk=>{ by[pk].forEach((s,j)=>{ const dir=j===0?-1:1; let prev=main[pk-1]; prev.used.add(dir<0?'U':'D');
    for(let k=1;k<=s.l;k++){ const a={x:prev.x,y:prev.y+dir*2,used:new Set([dir<0?'D':'U']),c:true}; if(k<s.l) a.used.add(dir<0?'U':'D'); bonds.push([prev,a]); carb.push(a); prev=a; } }); });
  const D={L:[-1,0],R:[1,0],U:[0,-1],D:[0,1]}; const hs=[];
  carb.forEach(c=>['L','R','U','D'].forEach(d=>{ if(!c.used.has(d)){ const h={x:c.x+D[d][0],y:c.y+D[d][1],c:false}; hs.push(h); bonds.push([c,h]); } }));
  const atoms=carb.concat(hs);
  const xs=atoms.map(a=>a.x*C), ys=atoms.map(a=>a.y*C);
  const pad=14, minx=Math.min(...xs)-pad, miny=Math.min(...ys)-pad, w=Math.max(...xs)-minx+pad, h=Math.max(...ys)-miny+pad;
  let s=`<svg class="fig" viewBox="${minx} ${miny} ${w} ${h}" width="${Math.round(w*1.15)}" role="img" aria-label="Strukturformel">`;
  bonds.forEach(([a,b])=>{ const x1=a.x*C,y1=a.y*C,x2=b.x*C,y2=b.y*C; const len=Math.hypot(x2-x1,y2-y1); const ra=9, rb=b.c?9:7;
    const ux=(x2-x1)/len, uy=(y2-y1)/len;
    s+=`<line class="st-bond" x1="${x1+ux*ra}" y1="${y1+uy*ra}" x2="${x2-ux*rb}" y2="${y2-uy*rb}"/>`; });
  atoms.forEach(a=>s+=`<text class="st-atom${a.c?'':' st-h'}" x="${a.x*C}" y="${a.y*C}" text-anchor="middle" dominant-baseline="central">${a.c?'C':'H'}</text>`);
  return s+'</svg>';
}
/* Zufallsmolekül für Namensübungen */
function randomMolecule(){
  for(let t=0;t<300;t++){
    const n=randInt(4,7); const k=randInt(1,n>=6?3:2); const subs=[];
    for(let j=0;j<k;j++){ const l=(n>=5&&Math.random()<0.28)?2:1; subs.push({p:randInt(2,n-1),l}); }
    const m={n,subs};
    const by={}; let bad=false; subs.forEach(s=>{(by[s.p]=by[s.p]||[]).push(s);});
    Object.values(by).forEach(a=>{ if(a.length>1&&a.some(s=>s.l>1)) bad=true; });
    if(!bad && !validate(m)) return m;
  }
  return {n:5,subs:[{p:2,l:1}]};
}
function nameOptions(m){
  const correct=nameOf(m), f=chooseFlip(m);
  const L=locs(m,f), Lw=locs(m,!f);
  const shifted=L.map(x=>({l:x.l,p:x.p+1}));
  const cands=[buildName(m.n,Lw), buildName(m.n,L,true), buildName(m.n+1,L), buildName(m.n,L,false,true), buildName(m.n-1,L), buildName(m.n,shifted), buildName(m.n+1,Lw)];
  const out=[]; shuffle(cands).forEach(c=>{ if(c!==correct && !out.includes(c) && out.length<3) out.push(c); });
  return {correct, wrong:out};
}
function namingQuestion(){
  const m=randomMolecule(); const o=nameOptions(m); const flip=Math.random()<0.5;
  const nm=o.correct;
  return {t:2, gen:true, q:'Wie heißt dieses Alkan? (Skelettformel)', svg:skeletonSVG(m,{flip,scale:1.6}), o:[nm].concat(o.wrong), a:0,
    e:`Längste Kette: <b>${m.n} C-Atome</b> → Stammname „${cap(STEMS[m.n])}an“. Nummeriere von der Seite, die die kleineren Nummern ergibt. Seitenketten alphabetisch, gleiche zusammenfassen. Summenformel: ${fm(sumFormula(m))}.`};
}

{id:1, title:'Homologe Reihe der Alkane', short:'CₙH₂ₙ₊₂, Methan bis Decan',
 goals:['Allgemeine Summenformel kennen und anwenden','Namen und Formeln von Methan bis Decan','Begriff „homologe Reihe“ erklären'],
 html:`<p><b>Alkane</b> sind <b>Kohlenwasserstoffe</b>: Sie bestehen nur aus Kohlenstoff (C) und Wasserstoff (H). Zwischen den Atomen gibt es nur <b>Einfachbindungen</b>. Darum heißen sie <b>gesättigt</b>: Mehr H-Atome passen nicht an das Gerüst.</p>
 <div class="formula-big">C<sub>n</sub>H<sub>2n+2</sub></div>
 <p>Das ist die allgemeine Summenformel. So rechnest du: <b>Anzahl H = 2 · Anzahl C + 2</b>. Beispiel Heptan: 2 · 7 + 2 = 16, also C<sub>7</sub>H<sub>16</sub>.</p>
 <h3>Homologe Reihe</h3>
 <p>Ordnet man die Alkane nach der Zahl ihrer C-Atome, unterscheidet sich jedes Glied vom nächsten um genau <b>eine CH<sub>2</sub>-Gruppe</b>. So eine Reihe heißt <b>homologe Reihe</b>. Alle Namen enden auf <b>-an</b>.</p>
 <p>Die ersten vier Namen musst du auswendig können: Meth-, Eth-, Prop-, But-. Ab fünf C-Atomen kommen griechische Zahlwörter: Pent (5), Hex (6), Hept (7), Oct (8), Non (9), Dec (10).</p>
 <div class="merk"><span class="merk-label">Eselsbrücke</span>„<b>M</b>eine <b>E</b>nte <b>P</b>addelt <b>B</b>ei <b>P</b>apa, <b>H</b>einz <b>H</b>olt <b>O</b>ma <b>N</b>ach <b>D</b>raußen.“</div>
 <h3>Bau der Moleküle</h3>
 <p>Jedes C-Atom hat <b>vier Bindungen</b>, jedes H-Atom eine. Die vier Bindungen am C zeigen in die Ecken eines <b>Tetraeders</b> (Winkel 109,5°). Darum ist eine Kohlenstoffkette in Wirklichkeit nicht gerade, sondern <b>zickzackförmig</b>.</p>
 <p class="hint">Auf deinem Arbeitsblatt steht „Metan“. Richtig heißt es <b>Methan</b>, mit h. Deine Summenformeln von Propan bis Decan stimmen alle.</p>`,
 widget:'homolog'},
{id:2, title:'Verzweigte Alkane', short:'Benennen nach IUPAC und Zeichnen',
 goals:['Ein verzweigtes Alkan aus der Formel richtig benennen','Aus einem Namen die Formel zeichnen','Typische Namensfehler erkennen'],
 html:`<p>Bei verzweigten Alkanen hängen an der Hauptkette <b>Seitenketten</b> (Alkylgruppen). Für den Namen gehst du immer in dieser Reihenfolge vor:</p>
 <ol>
 <li><b>Längste Kette suchen.</b> Sie gibt den Stammnamen (z. B. 6 C → Hexan). Achtung: Die längste Kette muss nicht gerade gezeichnet sein, sie kann um die Ecke gehen!</li>
 <li><b>Kette nummerieren</b>, und zwar von der Seite, bei der die Seitenketten die <b>kleinsten Nummern</b> bekommen.</li>
 <li><b>Seitenketten benennen:</b> aus -an wird -yl. –CH<sub>3</sub> = <b>Methyl</b>, –C<sub>2</sub>H<sub>5</sub> = <b>Ethyl</b>, –C<sub>3</sub>H<sub>7</sub> = <b>Propyl</b>, –C<sub>4</sub>H<sub>9</sub> = <b>Butyl</b>.</li>
 <li><b>Gleiche Seitenketten zusammenfassen</b> mit di (2), tri (3), tetra (4). Jede Position wird einzeln genannt: 2,2-Dimethyl, 2,3,4-Trimethyl.</li>
 <li><b>Alphabetisch ordnen.</b> Die Vorsilben di, tri, tetra zählen dabei nicht: <b>B</b>utyl vor <b>E</b>thyl vor <b>M</b>ethyl vor <b>P</b>ropyl.</li>
 <li><b>Schreibweise:</b> Zahlen untereinander mit Komma, zwischen Zahl und Wort ein Bindestrich. Die letzte Seitenkette hängt ohne Bindestrich am Stammnamen.</li>
 </ol>
 <div class="merk"><span class="merk-label">Beispiel</span><b>3-Ethyl-2,4-dimethylhexan</b>: Hauptkette 6 C (Hexan), an C3 eine Ethylgruppe, an C2 und C4 je eine Methylgruppe.</div>
 <div class="merk"><span class="merk-label">Sonderfall: gleicher Abstand</span>Ergeben beide Nummerierungen die gleichen Zahlen, bekommt die Seitenkette, die im Alphabet <b>zuerst</b> kommt, die kleinere Nummer. Beispiel: <b>3-Ethyl-5-methylheptan</b>, nicht 5-Ethyl-3-methylheptan.</div>
 <h3>Aus dem Namen zeichnen</h3>
 <ol><li>Hauptkette zeichnen (Stammname) und durchnummerieren.</li><li>Seitenketten an die genannten Nummern hängen.</li><li>Bei der Strukturformel jedes C mit H auf 4 Bindungen auffüllen.</li><li>Kontrolle mit C<sub>n</sub>H<sub>2n+2</sub> (alle C zählen, auch die in den Seitenketten).</li></ol>
 <h3>Typische Fehler</h3>
 <ul><li><b>„1-Methylbutan“</b> gibt es nicht. Eine Methylgruppe am Ende verlängert die Kette: Das ist Pentan.</li>
 <li><b>„2-Ethylbutan“</b> ist falsch. Über die Ethylgruppe ist die Kette 5 C lang: richtig ist <b>3-Methylpentan</b>.</li>
 <li><b>„2-Methyl-3-ethylpentan“</b>: falsche Reihenfolge. Richtig: 3-Ethyl-2-methylpentan.</li></ul>`,
 widget:'branch'},
{id:3, title:'Isomerie', short:'Gleiche Summenformel, andere Struktur',
 goals:['Isomere definieren','Alle Isomere von C₄ bis C₆ finden, zeichnen und benennen','Siedetemperaturen von Isomeren vergleichen und begründen'],
 html:`<p><b>Isomere</b> sind Verbindungen mit der <b>gleichen Summenformel</b>, aber einer <b>unterschiedlichen Struktur</b>: Die Atome sind anders miteinander verknüpft. Weil die Struktur anders ist, haben Isomere <b>unterschiedliche Eigenschaften</b>, zum Beispiel verschiedene Siedetemperaturen. Genauer heißt das Konstitutionsisomerie.</p>
 <p>Ab Butan gibt es Isomere, und ihre Zahl wächst schnell:</p>
 <div class="tbl"><table><tr><th>C-Atome</th><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td><td>10</td></tr><tr><th>Isomere</th><td>2</td><td>3</td><td>5</td><td>9</td><td>18</td><td>35</td><td>75</td></tr></table></div>
 <h3>Verzweigung und Siedetemperatur</h3>
 <p>Je stärker ein Molekül verzweigt ist, desto kompakter, fast kugelförmig, ist es. Seine <b>Oberfläche ist kleiner</b>, die Moleküle berühren sich weniger, und die <b>Van-der-Waals-Kräfte sind schwächer</b>. Folge: Die <b>Siedetemperatur sinkt</b>.</p>
 <div class="merk"><span class="merk-label">Achtung</span>Dasselbe Molekül, nur anders gezeichnet (Kette geknickt, gedreht, gespiegelt), ist <b>kein</b> neues Isomer. Prüfe es über den Namen: gleicher Name, gleiches Molekül.</div>
 <h3>So findest du alle Isomere</h3>
 <ol><li>Zeichne die unverzweigte Kette (z. B. Hexan).</li><li>Kürze die Hauptkette um 1 C und setze eine Methylgruppe an jede mögliche Stelle.</li><li>Kürze um 2 C und verteile zwei Methylgruppen (oder eine Ethylgruppe).</li><li>Benenne jedes Molekül und streiche doppelte Namen.</li></ol>`,
 widget:'isomer'},
{id:4, title:'Elektronegativität und Polarität', short:'ΔEN, polar/unpolar, Partialladungen',
 goals:['Elektronegativität definieren','Mit ΔEN entscheiden: unpolar, polar oder ionisch','Partialladungen δ+ und δ− richtig setzen','Erklären, wann ein Molekül ein Dipol ist'],
 html:`<p>Die <b>Elektronegativität (EN)</b> gibt an, wie stark ein Atom in einer Bindung die <b>Bindungselektronen zu sich zieht</b>. Fluor hat mit 4,0 den höchsten Wert. Im Periodensystem steigt die EN von links nach rechts und von unten nach oben.</p>
 <p>Entscheidend ist die <b>Differenz ΔEN</b> der beiden Bindungspartner:</p>
 <div class="tbl"><table><tr><th>ΔEN</th><th>Bindungsart</th><th>Beispiel</th></tr><tr><td>unter 0,5</td><td>unpolare Atombindung</td><td>C–H, H–H</td></tr><tr><td>0,5 bis 1,7</td><td>polare Atombindung</td><td>O–H, H–Cl</td></tr><tr><td>über 1,7</td><td>Ionenbindung</td><td>Na–Cl</td></tr></table></div>
 <h3>Partialladungen</h3>
 <p>In einer polaren Bindung sind die Elektronen zum elektronegativeren Atom verschoben. Es bekommt eine negative Teilladung <b class="minus">δ−</b> („delta minus“), der Partner eine positive Teilladung <b class="plus">δ+</b>. Das sind keine ganzen Ladungen wie bei Ionen.</p>
 <h3>Dipolmolekül</h3>
 <p>Ein Molekül ist ein <b>Dipol</b>, wenn es polare Bindungen hat <b>und</b> die Schwerpunkte der positiven und negativen Teilladungen nicht zusammenfallen. Das hängt von der Form ab:</p>
 <ul><li><b>H<sub>2</sub>O</b> ist gewinkelt: Dipol.</li><li><b>CO<sub>2</sub></b> ist linear und symmetrisch. Die Teilladungen heben sich auf: kein Dipol.</li><li><b>Alkane</b>: C–H-Bindungen sind fast unpolar (ΔEN = 0,3), die Moleküle sind symmetrisch gebaut. Alkane sind <b>unpolar</b>.</li></ul>
 <p class="hint">EN-Werte und Grenzen können in eurem Buch leicht anders sein (z. B. H = 2,1). Nimm in der Klausur die Werte aus eurem Unterricht.</p>`,
 widget:'en'},
{id:5, title:'Zwischenmolekulare Wechselwirkungen', short:'Van der Waals, H-Brücken',
 goals:['Entstehung von Van-der-Waals-Kräften erklären','Voraussetzungen für Wasserstoffbrücken nennen','Wechselwirkungen nach Stärke ordnen','Damit Siedetemperaturen begründen'],
 html:`<p><b>Zwischenmolekulare Wechselwirkungen</b> sind Anziehungskräfte <b>zwischen</b> Molekülen, nicht innerhalb. Sie sind viel schwächer als Atombindungen. Sie bestimmen, wie hoch die Siedetemperatur ist, ob sich Stoffe mischen und wie zähflüssig ein Stoff ist.</p>
 <h3>Van-der-Waals-Kräfte</h3>
 <p>Die Elektronen in einem Molekül bewegen sich ständig. Dadurch sind sie für einen kurzen Moment ungleich verteilt: Es entsteht ein <b>temporärer Dipol</b>. Dieser verschiebt die Elektronen im Nachbarmolekül, dort entsteht ein <b>induzierter Dipol</b>. Die entgegengesetzten Teilladungen ziehen sich an.</p>
 <ul><li>wirken zwischen <b>allen</b> Molekülen; bei Alkanen sind sie die <b>einzigen</b></li><li>sind die <b>schwächsten</b> Wechselwirkungen</li><li>werden stärker, je <b>größer die Oberfläche</b> (Kontaktfläche) der Moleküle ist</li></ul>
 <h3>Dipol-Dipol-Kräfte</h3>
 <p>Zwischen <b>Dipolmolekülen</b> wie HCl ziehen sich die dauerhaften Teilladungen an: δ+ des einen Moleküls und δ− des anderen. Sie sind stärker als Van-der-Waals-Kräfte.</p>
 <h3>Wasserstoffbrückenbindungen</h3>
 <p>Ein H-Atom, das an ein sehr elektronegatives Atom (<b>F, O oder N</b>) gebunden ist, ist stark positiv polarisiert (δ+). Es wird vom <b>freien Elektronenpaar</b> eines F-, O- oder N-Atoms im Nachbarmolekül angezogen.</p>
 ${H_BOND_SVG}
 <div class="merk"><span class="merk-label">Reihenfolge der Stärke</span>Van-der-Waals &lt; Dipol-Dipol &lt; Wasserstoffbrücken &lt;&lt; Atombindung</div>
 <h3>Anwendung</h3>
 <ul><li>Wasser (H<sub>2</sub>O, 18 u) siedet bei 100 °C, das fast gleich schwere Methan (CH<sub>4</sub>, 16 u) schon bei −162 °C. Der Grund sind die H-Brücken zwischen den Wassermolekülen.</li><li>Siedetemperatur, Löslichkeit und Viskosität der Alkane (Thema 6)</li><li>Eis schwimmt, Wasser hat eine hohe Oberflächenspannung, die DNA-Doppelhelix hält zusammen: alles H-Brücken.</li></ul>`,
 widget:'zmww'},
{id:6, title:'Eigenschaften der Alkane', short:'Löslichkeit, Siedetemperatur, Viskosität',
 goals:['Veränderung von Siedetemperatur und Viskosität in der Reihe erklären','Löslichkeit mit „Ähnliches löst Ähnliches“ begründen','Begriffe hydrophob, lipophil, hydrophil'],
 html:`<p>Alle Eigenschaften lassen sich über die <b>Van-der-Waals-Kräfte</b> erklären: Je länger die Kette, desto größer die Oberfläche, desto stärker die Kräfte zwischen den Molekülen.</p>
 <h3>Siedetemperatur</h3>
 <p>Beim Sieden müssen sich die Moleküle voneinander lösen. Je stärker sie sich anziehen, desto mehr Energie ist nötig: Die <b>Siedetemperatur steigt mit der Kettenlänge</b>. Verzweigte Isomere sieden niedriger, weil ihre Oberfläche kleiner ist.</p>
 <p>Aggregatzustand bei 20 °C: <b>C1–C4 gasförmig</b> (Erdgas, Feuerzeuggas), <b>C5–C16 flüssig</b> (Benzin, Diesel), <b>ab C17 fest</b> (Paraffin, Kerzenwachs).</p>
 <h3>Viskosität (Zähflüssigkeit)</h3>
 <p>Die <b>Viskosität steigt mit der Kettenlänge</b>. Lange Moleküle ziehen sich stärker an und können sich ineinander <b>verhaken</b>. Sie gleiten schlechter aneinander vorbei. Benzin ist dünnflüssig, Heizöl und Schmieröl sind dickflüssig.</p>
 <h3>Löslichkeit</h3>
 <div class="merk"><span class="merk-label">Merke</span>Ähnliches löst sich in Ähnlichem: polar in polar, unpolar in unpolar.</div>
 <p>Alkane sind unpolar. Sie sind <b>hydrophob</b> (wasserabweisend) und <b>lipophil</b> (fettliebend). Sie lösen sich in unpolaren Stoffen wie Benzin, Öl oder anderen Alkanen, aber <b>nicht in Wasser</b>.</p>
 <p><b>Warum nicht in Wasser?</b> Die Wassermoleküle halten über starke Wasserstoffbrücken zusammen. Alkanmoleküle können keine H-Brücken bilden. Sie würden die H-Brücken nur stören und dafür bloß schwache Van-der-Waals-Kräfte bieten. Deshalb bleiben Wasser und Alkan getrennt. Das Alkan schwimmt oben, weil es eine geringere Dichte hat.</p>
 <p>Mit wachsender Kettenlänge werden Alkane noch lipophiler. Stoffe, die sich gut in Wasser lösen (polare Stoffe), heißen <b>hydrophil</b>.</p>
 <h3>Brennbarkeit (Zusatz)</h3>
 <p>Kurze Alkane sind leicht entzündlich. Mit zunehmender Kettenlänge nimmt die Entzündbarkeit ab: Kerzenwachs brennt erst, wenn es am Docht geschmolzen und verdampft ist.</p>`,
 widget:'props'},
{id:7, title:'Formelschreibweisen und Definitionen', short:'Summen-, Struktur-, Skelettformel',
 goals:['Summen-, Struktur-, Halbstruktur- und Skelettformel unterscheiden','Zwischen den Schreibweisen umwandeln','Lewis-Formeln der ersten 5 Alkane zeichnen','Die Definitionen sicher können (Karteikarten)'],
 html:`<p>Ein Molekül kann man auf vier Arten aufschreiben:</p>
 <div class="tbl"><table>
 <tr><th>Schreibweise</th><th>Was sie zeigt</th><th>Butan</th></tr>
 <tr><td><b>Summenformel</b></td><td>nur Art und Anzahl der Atome. Sagt nichts über die Struktur: Isomere haben dieselbe!</td><td class="mono">C<sub>4</sub>H<sub>10</sub></td></tr>
 <tr><td><b>Strukturformel</b> (Valenzstrich-, Lewis-Formel)</td><td>alle Atome und alle Bindungen als Striche</td><td>siehe unten</td></tr>
 <tr><td><b>Halbstrukturformel</b></td><td>C–C-Bindungen als Strich, H am C zusammengefasst. Seitenketten hängen mit einem senkrechten Strich oben oder unten am C</td><td class="mono">CH<sub>3</sub>–CH<sub>2</sub>–CH<sub>2</sub>–CH<sub>3</sub></td></tr>
 <tr><td><b>Skelettformel</b></td><td>Zickzack-Linie: jede Ecke und jedes Ende ist ein C-Atom, H am C wird weggelassen</td><td>siehe unten</td></tr>
 </table></div>
 <h3>Räumliche Darstellungen</h3>
 <div class="tbl"><table>
 <tr><th>Darstellung</th><th>Was sie zeigt</th></tr>
 <tr><td><b>Keil-Strich-Formel</b></td><td>die räumliche Anordnung: normaler Strich = in der Zeichenebene, Keil = Bindung zeigt nach vorn, gestrichelter Keil = nach hinten</td></tr>
 <tr><td><b>Kugel-Stab-Modell</b></td><td>Atome als Kugeln, Bindungen als Stäbe. Gut für Bindungswinkel (109,5°) und Bindungslängen</td></tr>
 <tr><td><b>Kalottenmodell</b></td><td>Atome als ineinander geschobene Kugelkappen. Zeigt, wie viel Raum das Molekül einnimmt, aber keine einzelnen Bindungen</td></tr>
 </table></div>
 <p>Bei Alkanen gibt es keine freien Elektronenpaare. Darum sind <b>Lewis-Formel und Strukturformel hier gleich</b>.</p>
 <h3>Lewis-Formel zeichnen (Aufgabe 1 vom Arbeitsblatt)</h3>
 <ol><li>C-Atome nebeneinander schreiben und mit Strichen verbinden.</li><li>Jedes C braucht 4 Striche. Fehlende Striche mit H-Atomen auffüllen.</li><li>Kontrolle: Zahl der H = 2 · C + 2.</li></ol>
 <h3>Skelettformel lesen</h3>
 <p>Zähle Ecken und Enden: Eine Zickzack-Linie mit 2 Enden und 4 Knicken hat 6 C-Atome, das ist Hexan. Jedes C ergänzt du in Gedanken mit H auf 4 Bindungen.</p>
 <p>Alle Definitionen für die Klausur findest du unter <a href="#karten" style="color:var(--accent);font-weight:700">Karteikarten</a>.</p>`,
 widget:'notation'}

{t:3,q:'Sind Butan und 2-Methylpropan Isomere?',o:['Ja, beide haben die Summenformel C<sub>4</sub>H<sub>10</sub>.','Nein, 2-Methylpropan hat nur 3 C-Atome.','Nein, sie gehören zu verschiedenen Stoffklassen.','Ja, aber nur bei hoher Temperatur.'],a:0,e:'Propan (3 C) + Methyl (1 C) = 4 C. Gleiche Formel, andere Struktur.'},

{t:4,q:'Welches Element hat die höchste Elektronegativität?',o:['Fluor','Sauerstoff','Chlor','Stickstoff'],a:0,e:'Fluor: EN = 4,0. Es steht oben rechts im Periodensystem (ohne Edelgase).'},

{t:5,q:'Was ist die Voraussetzung für eine Wasserstoffbrücke?',o:['Ein H-Atom an F, O oder N und ein freies Elektronenpaar an F, O oder N im Nachbarmolekül','Ein H-Atom an einem C-Atom','Ein Molekül mit vielen C-Atomen','Eine Ionenbindung im Molekül'],a:0,e:'Nur an F, O, N ist das H stark genug positiv polarisiert.'},

{t:5,q:'Wasser (18 u) siedet bei 100 °C, Methan (16 u) bei −162 °C. Warum?',o:['Zwischen Wassermolekülen gibt es H-Brücken, zwischen Methanmolekülen nur Van-der-Waals-Kräfte.','Wasser ist schwerer.','Methan ist polarer als Wasser.','Wasser hat mehr Atome.'],a:0,e:'Die Masse ist fast gleich. Den Unterschied machen die H-Brücken.'},

const TASKS=[
{t:6,q:'<b>Erkläre</b>, warum die Siedetemperaturen der Alkane mit zunehmender Kettenlänge steigen.',
 sol:()=>`<p>Zwischen Alkanmolekülen wirken nur Van-der-Waals-Kräfte. <b>Je länger</b> die Kohlenstoffkette ist, <b>desto größer</b> ist die Oberfläche der Moleküle. <b>Desto stärker</b> sind die Van-der-Waals-Kräfte zwischen den Molekülen. <b>Desto mehr Energie</b> muss beim Sieden zugeführt werden, um die Moleküle voneinander zu trennen. Deshalb steigt die Siedetemperatur.</p><p class="hint">Punkte gibt es für: nur VdW-Kräfte, Oberfläche, Stärke der Kräfte, Energie zum Trennen. Die Je-desto-Kette ist das Gerüst.</p>`},
{t:6,q:'<b>Erkläre</b>, warum sich Hexan nicht in Wasser löst, aber gut in Benzin.',
 sol:()=>`<p>Hexan ist unpolar (C–H-Bindungen fast unpolar, symmetrischer Bau). Zwischen Hexanmolekülen wirken nur Van-der-Waals-Kräfte. Wasser ist polar, seine Moleküle halten über Wasserstoffbrücken zusammen.</p><p>Hexanmoleküle können keine H-Brücken bilden. Würden sie sich zwischen die Wassermoleküle schieben, müssten H-Brücken aufgebrochen werden, ohne dass gleich starke Anziehung entsteht. Deshalb mischen sich Hexan und Wasser nicht.</p><p>Benzin besteht aus unpolaren Alkanen. Zwischen Hexan und Benzin wirken die gleichen Van-der-Waals-Kräfte, sie mischen sich: „Ähnliches löst sich in Ähnlichem“. Hexan ist hydrophob und lipophil.</p>`},
{t:3,q:'<b>Zeichne</b> alle Isomere von C<sub>5</sub>H<sub>12</sub> als Skelettformel und <b>benenne</b> sie.',
 sol:()=>`<div class="iso-grid">${[{n:5,subs:[]},{n:4,subs:[{p:2,l:1}]},{n:3,subs:[{p:2,l:1},{p:2,l:1}]}].map(m=>`<div class="iso">${skeletonSVG(m,{scale:1.3})}<div class="nm">${nameOf(m)}</div></div>`).join('')}</div>`},
{t:2,q:'<b>Zeichne</b> 3-Ethyl-2,4-dimethylhexan als Skelettformel und gib die Summenformel an.',
 sol:()=>{const m={n:6,subs:[{p:2,l:1},{p:3,l:2},{p:4,l:1}]}; return `<div class="figbox">${skeletonSVG(m,{nums:true,dots:true})}</div><div class="figbox">${halb(m)}</div><p>Hauptkette 6 C (schwarz), Seitenketten orange. Summenformel: 6 + 2 + 1 + 1 = 10 C, also <b>${fm(sumFormula(m))}</b>.</p>`;}},
{t:4,q:'<b>Ordne</b> die Bindungen nach steigender Polarität und <b>begründe</b>: O–H, C–H, C–O, N–H. (EN: H 2,2; C 2,5; N 3,0; O 3,5)',
 sol:()=>`<p>ΔEN berechnen: C–H = 0,3; N–H = 0,8; C–O = 1,0; O–H = 1,3.</p><p><b>C–H &lt; N–H &lt; C–O &lt; O–H</b></p><p>Je größer die Elektronegativitätsdifferenz, desto stärker sind die Bindungselektronen zum elektronegativeren Atom verschoben, desto polarer ist die Bindung. C–H ist praktisch unpolar.</p>`},
{t:5,q:'<b>Erkläre</b> am Beispiel von Wasser, wie eine Wasserstoffbrückenbindung entsteht. Zeichne eine Skizze.',
 sol:()=>`${H_BOND_SVG}<p>Im Wassermolekül ist O viel elektronegativer als H (ΔEN = 1,3). Die O–H-Bindungen sind stark polar: Das O trägt δ−, die H-Atome tragen δ+. Das stark positiv polarisierte H-Atom eines Wassermoleküls wird vom freien Elektronenpaar am O-Atom eines Nachbarmoleküls angezogen. Diese Anziehung ist die Wasserstoffbrücke (gestrichelt gezeichnet).</p>`},
{t:5,q:'<b>Erkläre</b> die Entstehung von Van-der-Waals-Kräften.',
 sol:()=>`<p>Die Elektronen in einem Molekül sind ständig in Bewegung. Dadurch sind sie für einen kurzen Moment ungleich verteilt: Auf einer Seite entsteht δ−, auf der anderen δ+. Das Molekül ist ein <b>temporärer Dipol</b>.</p><p>Dieser Dipol verschiebt die Elektronen im Nachbarmolekül (die δ−-Seite stößt dessen Elektronen ab). Dort entsteht ein <b>induzierter Dipol</b>. Die entgegengesetzten Teilladungen ziehen sich an. Diese schwache Anziehung heißt Van-der-Waals-Kraft. Sie ist umso stärker, je größer die Oberfläche der Moleküle ist.</p>`},
{t:3,q:'2,2-Dimethylpropan siedet bei 9,5 °C, Pentan bei 36 °C. Beide haben die Formel C<sub>5</sub>H<sub>12</sub>. <b>Erkläre</b> den Unterschied.',
 sol:()=>`<p>Beide Stoffe sind Isomere: gleiche Summenformel, unterschiedliche Struktur. Zwischen den Molekülen wirken nur Van-der-Waals-Kräfte.</p><p>Pentan ist unverzweigt und lang gestreckt. Die Moleküle können sich auf großer Fläche berühren. 2,2-Dimethylpropan ist stark verzweigt und fast kugelförmig. Seine Oberfläche ist kleiner, die Kontaktfläche zwischen den Molekülen ist geringer. Darum sind die Van-der-Waals-Kräfte schwächer, und es wird weniger Energie zum Trennen der Moleküle benötigt. Die Siedetemperatur ist niedriger.</p>`},
{t:7,q:'<b>Zeichne</b> die Lewis-Formeln (Strukturformeln) von Methan, Ethan, Propan, Butan und Pentan.',
 sol:()=>[1,2,3,4,5].map(n=>`<p style="margin-bottom:0"><b>${ALKANES[n].name}</b> · ${fm(sumFormula({n,subs:[]}))}</p><div class="figbox">${structSVG({n,subs:[]})}</div>`).join('')},
{t:1,q:'<b>Nenne</b> die Summenformeln von Nonan und Pentadecan (15 C) und <b>erkläre</b>, wie du sie bestimmst.',
 sol:()=>`<p>Nonan: <b>C<sub>9</sub>H<sub>20</sub></b>. Pentadecan: <b>C<sub>15</sub>H<sub>32</sub></b>.</p><p>Alkane folgen der allgemeinen Formel C<sub>n</sub>H<sub>2n+2</sub>: Die Zahl der H-Atome ist das Doppelte der C-Atome plus zwei (2 · 9 + 2 = 20; 2 · 15 + 2 = 32).</p>`}
];

}

function renderOrder(set,onDone){
  const box=el(`<div class="q"><div class="eyebrow">Thema ${set.t} · Antwort bauen</div><div class="qt">${set.title}</div><p class="muted" style="margin:0;font-size:.9rem">Tippe die Sätze in der richtigen Reihenfolge an.</p><div class="order-done"></div><div class="order-pool"></div><div class="res"></div></div>`);
  let step=0,miss=0; const pool=$('.order-pool',box), done=$('.order-done',box);
  pool.innerHTML=shuffle(set.parts.map((p,i)=>i)).map(i=>`<button type="button" data-i="${i}">${set.parts[i]}</button>`).join('');
  pool.addEventListener('click',e=>{ const b=e.target.closest('[data-i]'); if(!b) return;
    if(+b.dataset.i===step){ done.appendChild(el(`<div>${set.parts[step]}</div>`)); b.remove(); step++;
      if(step===set.parts.length){ $('.res',box).innerHTML= miss===0?'<div class="okmsg" style="margin-top:8px">Fehlerfrei! So schreibst du es in der Klausur.</div>':`<div class="expl" style="margin-top:8px">Geschafft mit ${miss} Fehlversuch${miss>1?'en':''}. Lies die fertige Antwort noch einmal laut.</div>`; if(miss===0) award(10,'fehlerfrei'); onDone&&onDone(miss===0); } }
    else { miss++; b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); if(navigator.vibrate){ try{navigator.vibrate(40);}catch(e){} } } });
  return box;
}

/* ---------- Rendering: Fragen ---------- */
function renderQuestion(q,onDone){
  const order=shuffle(q.o.map((t,i)=>i));
  const box=el(`<div class="q"><div class="eyebrow">Thema ${q.t}</div><div class="qt">${q.q}</div>${q.svg?`<div class="figbox">${q.svg}</div>`:''}<div class="opts"></div></div>`);
  const opts=$('.opts',box);
  order.forEach(i=>{ const b=el(`<button class="opt" type="button">${q.o[i]}</button>`); b.dataset.i=i; opts.appendChild(b); });
  opts.addEventListener('click',ev=>{
    const b=ev.target.closest('.opt'); if(!b||b.disabled) return;
    const ok=+b.dataset.i===q.a;
    opts.querySelectorAll('.opt').forEach(x=>{ x.disabled=true; if(+x.dataset.i===q.a) x.classList.add('right'); });
    if(!ok) b.classList.add('wrong');
    box.appendChild(el(`<div class="expl">${ok?'<b class="r">Richtig.</b> ':'<b class="f">Leider falsch.</b> '}${q.e}</div>`));
    if(!q.gen){ S.wrong=S.wrong||{}; if(ok) delete S.wrong[q.q]; else S.wrong[q.q]=1; save(); }
    if(ok) award(5);
    if(!ok && navigator.vibrate){ try{ navigator.vibrate(60); }catch(e){} }
    onDone&&onDone(ok);
  });
  return box;
}

  </div>

    const ea=AT.find(x=>x[0]===A)[1], eb=AT.find(x=>x[0]===B)[1]; const d=Math.round(Math.abs(ea-eb)*10)/10;

    let da='',db='';
    if(d>=0.5&&d<=1.7){ if(ea>eb){da='<span class="minus">δ−</span>';db='<span class="plus">δ+</span>';} else {da='<span class="plus">δ+</span>';db='<span class="minus">δ−</span>';} }
    if(d>1.7){ if(ea>eb){da='<span class="minus">−</span>';db='<span class="plus">+</span>';} else {da='<span class="plus">+</span>';db='<span class="minus">−</span>';} }
    $('#en-bond',root).innerHTML=`<div class="at"><span class="d">${da}</span><span class="s">${A}</span></div>${d>1.7?'<div style="width:40px"></div>':'<div class="line"></div>'}<div class="at"><span class="d">${db}</span><span class="s">${B}</span></div>`;
    $('#en-type',root).textContent=`ΔEN = ${dec(d.toFixed(1))} · ${type}`;
    $('#en-mark',root).style.left=`calc(${Math.min(d,3.2)/3.2*100}% - 1.5px)`;
    const more=ea>eb?A:B, less=ea>eb?B:A;

      : d<=1.7? `<b>${more}</b> ist elektronegativer (${dec(Math.max(ea,eb).toFixed(1))} gegenüber ${dec(Math.min(ea,eb).toFixed(1))}). Es zieht das Bindungselektronenpaar zu sich und bekommt δ−, <b>${less}</b> bekommt δ+.`
      : `Der Unterschied ist so groß, dass <b>${more}</b> das Elektron ganz übernimmt. Es entstehen Ionen: ${less}<sup>+</sup> und ${more}<sup>−</sup>.`; };

function trWeights(){ const w={}; const wrong=S.wrong||{}; const st=S.trs||{};
  for(let t=1;t<=7;t++){ const s=st[t]||{r:0,n:0}; const rate=s.n? s.r/s.n : 0.5;
    w[t]=1 + (S.done[t]?0:1) + 3*(1-rate) + QUESTIONS.filter(q=>q.t===t&&wrong[q.q]).length*0.7; }
  return w; }
function trPickTopic(){ if(tr.topic) return tr.topic; const w=trWeights(); let sum=0; for(const t in w) sum+=w[t]; let x=Math.random()*sum; for(const t in w){ x-=w[t]; if(x<=0) return +t; } return 7; }

  if(r<0.12){ const os=ORDERS.filter(o=>o.t===t); if(os.length) return {order:pick(os)}; }
  if(r<0.20 && (t===1||t===2||t===7)) return {match:t===2?'iupac':pick(['homolog','formel','begriffe'])};
  if(r<0.62) return genQ(t);

    if(selA.dataset.k===selB.dataset.k){ [selA,selB].forEach(x=>{x.classList.remove('sel');x.classList.add('done');x.disabled=true;}); solved++;

    const num=v=>String(v).split('.').map(n=>+n||0), a=num(j.version), b=num(APP_VERSION);

function applyGifts(g){ if(!Array.isArray(g)||!g.length) return; let c=0, nm=null, nf=0, ni=0;
  S.friends=S.friends||{}; S.owned=S.owned||{};
  g.forEach(x=>{ c+=Math.max(-1000000,Math.min(1000000,parseInt(x.coins,10)||0)); if(x.name) nm=String(x.name).slice(0,16);
    const ex=x.extra||{};

    const ids=ex.allItems?SHOP.map(i=>i.id):(Array.isArray(ex.items)?ex.items:[]);
    ids.forEach(id=>{ if(SHOP.some(i=>i.id===id)&&!S.owned[id]){ S.owned[id]=1; ni++; } }); });
  if(!c&&!nm&&!nf&&!ni) return;
  if(c) S.coins=Math.max(0,(S.coins||0)+c); if(nm) S.name=nm; save();
  toast('🎁 '+[c?'<b>'+(c>0?'+':'')+c+'</b> 🪙':'', nm?'Neuer Name: <b>'+nm.replace(/[<&]/g,'')+'</b>':'', nf?'<b>'+nf+'</b> neue Freunde':'', ni?'<b>'+ni+'</b> neue Items':''].filter(Boolean).join(' · '));

function cloudPull(){ if(!cloudOk()) return; cloudSecret();
  cloudPost('get',{pid:S.pid,secret:S.cloud.secret,gifts:1}).then(({status,j})=>{ setTimeout(()=>applyGifts(j&&j.gifts),50);

    else if((S.savedAt||0) > (j.data&&j.data.savedAt||0)+1000) cloudPush();

/* ---------- Battle: 1 gegen 1 online (Kahoot-Stil) ---------- */
const BATTLE_HTTP='https://alkane-battle.onrender.com/', BATTLE_WS='wss://alkane-battle.onrender.com';
const KSHAPE=['▲','◆','●','■'];
let B={ws:null,phase:'lobby',msg:'',code:'',you:0,host:false,opp:null,scores:[0,0],q:null,qi:0,total:10,pick:-1,oppDone:false,reveal:null,end:null,correct:0,oppRematch:false,timer:null};
function battleQuestions(){
  // 10 Fragen, keine doppelt: jede Fragenart (Generator), feste Frage und Aussage höchstens einmal
  const used=new Set(), out=[];
  for(const t of shuffle([1,2,3,4,5,6,7,1,2,6])){
    let q=null;
    for(let tries=0; tries<60 && !q; tries++){
      const r=Math.random(); let c, key;
      if(r<0.15){ const x=pick(TF.filter(y=>y[0]===t)); key='tf:'+x[1]; c={t, q:'Richtig oder falsch? '+x[1], o:['Richtig','Falsch'], a:x[2]?0:1, e:x[3]}; }
      else if(r<0.3){ const b=pick(QUESTIONS.filter(y=>y.t===t)); key='bank:'+b.q; c=b; }
      else { const gi=Math.floor(Math.random()*GEN[t].length), g=GEN[t][gi]; key='gen:'+(g.name||t+':'+gi); c=g(); }
      const txt='txt:'+c.q.replace(/<[^>]+>/g,'')+'|'+(c.svg||'');
      if(used.has(key)||used.has(txt)) continue;
      used.add(key); used.add(txt); q=c;
    }
    if(!q) continue;
    if(q.o[0]==='Richtig'&&q.o.length===2){ out.push(q); continue; }
    const order=shuffle(q.o.map((_,i)=>i));
    out.push({t:q.t||t, q:q.q, o:order.map(i=>q.o[i]), a:order.indexOf(q.a), e:q.e||'', svg:q.svg||''});
  }
  return out;
}
const helloMsg=()=>({type:'hello',id:S.pid,name:S.name,avatar:S.eq.avatar,title:S.eq.title,color:S.eq.color,ready:true});
function bSend(m){ if(B.ws&&B.ws.readyState===1) B.ws.send(JSON.stringify(m)); }
function bConnect(then){
  if(B.ws&&B.ws.readyState===1){ then(); return; }
  if(B.ws&&B.ws.readyState===0){ B.ws.addEventListener('open',()=>setTimeout(then,50),{once:true}); return; }
  B.phase='connecting'; B.msg='Verbinde mit dem Battle-Server …'; drawBattle();
  const slow=setTimeout(()=>{ if(B.phase==='connecting'){ B.msg='Der Server wird gerade aufgeweckt. Beim ersten Mal kann das bis zu einer Minute dauern.'; drawBattle(); } },3000);
  const ctl=('AbortController' in window)?new AbortController():null; const to=setTimeout(()=>ctl&&ctl.abort(),75000);
  fetch(BATTLE_HTTP,{cache:'no-store',signal:ctl?ctl.signal:undefined}).then(r=>r.json()).then(()=>{
    clearTimeout(to); let ws; try{ ws=new WebSocket(BATTLE_WS); }catch(e){ return fail(); }
    B.ws=ws;
    ws.onopen=()=>{ clearTimeout(slow); bSend(helloMsg()); then(); };
    ws.onmessage=ev=>{ let m; try{ m=JSON.parse(ev.data); }catch(e){ return; } bMsg(m); };
    ws.onclose=()=>{ if(B.ws===ws) B.ws=null; if(B.token && B.phase!=='lobby') bReconnect(); else { if(!['lobby','end'].includes(B.phase)){ B.phase='lobby'; B.msg='Verbindung verloren. Versuch es nochmal.'; drawBattle(); } setTimeout(bSilentConnect,5000); } };
    ws.onerror=()=>{};
  }).catch(fail);
  function fail(){ clearTimeout(slow); clearTimeout(to); B.phase='lobby'; B.msg= location.protocol==='https:'&&!/onrender\.com$/.test(location.hostname) ? 'Hier ist keine Online-Verbindung möglich. Battle geht in der App oder auf alkane-trainer.onrender.com.' : 'Server nicht erreichbar. Prüfe dein Internet und versuch es nochmal.'; drawBattle(); }
}
/* Wiederverbinden nach App-Wechsel: Platz bleibt 90 s frei */
function bSaveSession(){ try{ localStorage.setItem('alkane-battle-session',JSON.stringify({code:B.code,token:B.token,ts:Date.now()})); }catch(e){} }
function bClearSession(){ B.token=null; try{ localStorage.removeItem('alkane-battle-session'); }catch(e){} }
function bReconnect(){
  if(B.reconnecting||!B.token) return;
  B.reconnecting=true; B.reTries=0; drawBattle();
  const tryOnce=()=>{
    if(!B.token){ B.reconnecting=false; return; }
    if(B.reTries++>45){ B.reconnecting=false; bClearSession(); B.phase='lobby'; B.msg='Verbindung verloren. Das Battle ist leider vorbei.'; drawBattle(); return; }
    let ws; try{ ws=new WebSocket(BATTLE_WS); }catch(e){ return setTimeout(tryOnce,2000); }
    B.ws=ws; let opened=false;
    ws.onopen=()=>{ opened=true; bSend(helloMsg()); bSend({type:'resume',code:B.code,token:B.token}); };
    ws.onmessage=ev=>{ let m; try{ m=JSON.parse(ev.data); }catch(e){ return; } bMsg(m); };
    ws.onclose=()=>{ if(B.ws===ws) B.ws=null; if(B.reconnecting) setTimeout(tryOnce,2000); else if(B.token&&B.phase!=='lobby') bReconnect(); };
    ws.onerror=()=>{};
  };
  tryOnce();
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && B.token && B.phase!=='lobby' && !(B.ws&&B.ws.readyState===1)){ B.reconnecting=false; bReconnect(); } });

  else if(m.type==='q'){ Object.assign(SP,{state:'question',q:m.q,qi:m.qi,total:m.total,limit:m.limit,qStart:Date.now(),answered:[],reveal:null}); }
  else if(m.type==='spec_answered'){ SP.answered=m.answered; }

function battleClick(e){
  if(!location.hash.startsWith('#battle')) return;
  if(admClick(e)) return;
  if(socialClick(e)) return;
  const nm=$('#b-name'); if(nm){ S.name=nm.value.trim().slice(0,16); save(); }
  const b=e.target.closest('[data-b]'), k=e.target.closest('.kopt'), em=e.target.closest('[data-e]');
  if(k && B.phase==='question' && B.pick<0){ B.pick=+k.dataset.k; bSend({type:'answer',qi:B.qi,i:B.pick}); drawBattle(); return; }
  if(em){ const now=Date.now(); if(now-(B.lastEmo||0)<1200) return; B.lastEmo=now; bSend({type:'emote',e:em.dataset.e}); return; }
  if(!b) return;
  const a=b.dataset.b;
  const needName=()=>{ if(!S.name){ B.msg='Gib zuerst deinen Namen ein.'; drawBattle(); const n=$('#b-name'); n&&n.focus(); return true; } return false; };
  if(a==='quick'){ if(needName()) return; B.msg=''; bConnect(()=>bSend({type:'quick'})); }
  if(a==='create'){ if(needName()) return; B.msg=''; bConnect(()=>bSend({type:'create'})); }
  if(a==='join'){ if(needName()) return; const c=($('#b-code').value||'').trim(); if(!/^\d{4}$/.test(c)){ B.msg='Der Code hat 4 Ziffern.'; drawBattle(); return; } B.msg=''; bConnect(()=>bSend({type:'join',code:c})); }
  if(a==='cancel'){ bSend({type:'cancel'}); bClearSession(); B.phase='lobby'; B.isTeam=false; drawBattle(); }
  if(a==='ready'){ if(B.phase==='reveal'&&!B.myReady){ B.myReady=true; bSend({type:'ready',qi:B.qi}); drawBattle(); } return; }
  if(a==='tcreate2'||a==='tcreate3'){ if(needName()) return; B.msg=''; bConnect(()=>bSend({type:'tcreate',size:a==='tcreate3'?3:2})); }
  if(a==='unwatch'){ bSend({type:'unwatch'}); B.spec=false; SP=null; B.phase='lobby'; B.msg=''; drawBattle(); return; }

  lines.forEach(l=>{ const m=l.match(/^\s*[-•*]\s+(.*)/); if(m){ if(!inList){ out+='<ul>'; inList=true; } out+='<li>'+m[1]+'</li>'; } else { if(inList){ out+='</ul>'; inList=false; } if(l.trim()) out+='<p>'+l+'</p>'; } });
  if(inList) out+='</ul>'; return out; }
/* Ersatz ohne KI: passende Stellen aus dem Lernstoff suchen */

const STOP=new Set('der die das und oder ist sind ein eine einen was wie warum wieso weshalb wer wo mir mich ich du bei mit von zu im in am an auf für den dem des es sich nicht nur auch man kann erklär erkläre erklären bitte mal noch so hat haben wird werden'.split(' '));
function localAnswer(q){ if(!KB) buildKB();
  const words=q.toLowerCase().replace(/[^a-zäöüß0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>2&&!STOP.has(w));

  if(!sc.length) return 'Dazu habe ich im Lernstoff nichts gefunden. Versuch es mit einem Fachbegriff, z. B. „Isomere“, „Elektronegativität“ oder „Siedetemperatur“.';

async function botAsk(q){
  q=q.trim(); if(!q||BOT.busy) return;
  if(/karteikarte|lernkarte|flashcard|\bkarten\s+(zu|zur|zum|über|für)\b/i.test(q)){
    BOT.msgs.push({role:'user',text:q}); BOT.busy=true; drawChat(); botSave();
    const d=await makeDeck(q); BOT.busy=false;
    BOT.msgs.push(d?{role:'bot',text:`Fertig! Ich habe dir **${d.cards.length} Karteikarten** zu „${d.title}“ erstellt${d.ai?'':' (aus dem Lernstoff der App)'}. Du findest sie jederzeit im Tab **Karten**.`,deck:d.id}:{role:'bot',text:'Dazu konnte ich gerade keine Karteikarten erstellen. Versuch ein Klausurthema, z. B. „Karteikarten zur homologen Reihe“.'});
    botSave(); drawChat(); return;
  }
  BOT.msgs.push({role:'user',text:q}); BOT.busy=true; drawChat(); botSave();
  let answer=null, why='';
  if(netCapable()){
    try{
      const ctl=new AbortController(); let to=setTimeout(()=>ctl.abort(),70000);
      // text/plain = einfache Anfrage ohne Vorab-Prüfung (die blockiert Android bei lokalen App-Dateien)
      const r=await fetch(BOT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({messages:BOT.msgs.slice(-12)}),signal:ctl.signal});
      const ct=r.headers.get('content-type')||'';
      if(r.ok && ct.startsWith('text/plain') && r.body && r.body.getReader){
        // Live-Text: Antwort erscheint, während die KI schreibt
        const msg={role:'bot',text:''}; BOT.msgs.push(msg); BOT.busy=false;
        const reader=r.body.getReader(), dec=new TextDecoder(); let last=0;
        for(;;){ const {done,value}=await reader.read(); if(done) break;
          clearTimeout(to); to=setTimeout(()=>ctl.abort(),30000);
          msg.text+=dec.decode(value,{stream:true});
          const now=Date.now(); if(now-last>60){ last=now; drawChat(); } }
        clearTimeout(to); drawChat(); botSave();
        if(navigator.vibrate){ try{navigator.vibrate(20);}catch(e){} }
        return;
      }
      clearTimeout(to);
      const j=await r.json();
      if(r.ok&&j.answer) answer=j.answer; else if(r.status===429) answer=j.error; else why='Server meldet '+r.status+(j.error?' '+j.error:'');
    }catch(e){ const l=BOT.msgs[BOT.msgs.length-1]; if(l.role==='bot'&&l.text){ BOT.busy=false; drawChat(); botSave(); return; } why=(e&&e.name==='AbortError')?'Zeitüberschreitung':((e&&e.message)||'Netzwerkfehler'); }
  } else why='keine Online-Verbindung auf dieser Seite';
  if(!answer) answer=localAnswer(q).replace('(Antwort aus dem Lernstoff der App)',`(Antwort aus dem Lernstoff der App. KI nicht erreichbar: ${why||'unbekannt'})`);
  BOT.busy=false; BOT.msgs.push({role:'bot',text:answer}); botSave(); drawChat();
  if(navigator.vibrate){ try{navigator.vibrate(20);}catch(e){} }
}

function deckTitle(topic){

function localDeck(topic){
  const q=topic.toLowerCase(), out=[];
  if(/homolog|reihe|methan|ethan|decan|namen|summenformel|alkane? (von|bis)/.test(q))
    for(let n=1;n<=10;n++) out.push([ALKANES[n].name, `${usub('C'+(n>1?n:'')+'H'+(2*n+2))} · ${n} C-Atom${n>1?'e':''} · Sdp. ${dec(ALKANES[n].bp)} °C · bei 20 °C ${ALKANES[n].bp<20?'gasförmig':'flüssig'}`]);
  const words=q.replace(/[^a-zäöüß0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>3&&!STOP.has(w)&&!/karte|erstell|mach/.test(w));
  const strip=h=>h.replace(/<sub>(\d+)<\/sub>/g,(m,d)=>d.split('').map(x=>SUB[x]).join('')).replace(/<[^>]+>/g,'');
  CARDS.forEach(c=>{ const t=(c[0]+' '+c[1]).toLowerCase(); if(words.some(w=>t.includes(w.slice(0,Math.max(4,w.length-2))))) out.push([strip(c[0]),strip(c[1])]); });
  TF.forEach(x=>{ if(out.length>=16) return; const t=x[1].toLowerCase(); if(words.some(w=>t.includes(w.slice(0,Math.max(4,w.length-2))))) out.push([strip('Richtig oder falsch? '+x[1]), (x[2]?'Richtig. ':'Falsch. ')+strip(x[3])]); });
  const seen=new Set(); return out.filter(c=>!seen.has(c[0])&&seen.add(c[0])).slice(0,16);
}
