<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alkane Klausurtrainer</title>
<style>
:root{--bg:#e8edeb;--fg:#566461;--accent:#bb4f17}
@media (prefers-color-scheme: dark){:root{--bg:#121817;--fg:#97a6a2;--accent:#f08a4b;color-scheme:dark}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
.l{display:flex;flex-direction:column;align-items:center;gap:14px}
.s{width:34px;height:34px;border:3px solid var(--fg);border-top-color:var(--accent);border-radius:50%;animation:r .8s linear infinite;opacity:.8}
@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="l"><div class="s"></div><div>Lade neueste Version …</div></div>
<script>
/* Holt die aktuelle App von GitHub (Repo Vanacho1202/Chemie-, Datei web/index.html).
   Ohne Internet: zuletzt geladene Version, sonst die eingebaute Kopie (app.html). */
(function(){
  var SRC = 'https://raw.githubusercontent.com/Vanacho1202/Chemie-/main/web/index.html';
  var KEY = 'alkane-live-html';
  var done = false;
  function show(html){ document.open(); document.write(html); document.close(); }
  function offline(){
    var c = null;
    try { c = localStorage.getItem(KEY); } catch(e) {}
    if (c) show(c); else location.replace('app.html' + location.hash);
  }
  var timer = setTimeout(function(){ if(!done){ done = true; offline(); } }, 5000);
  fetch(SRC + '?t=' + Date.now(), { cache: 'no-store' })
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
    .then(function(html){
      if (html.indexOf('Alkane') < 0 || html.length < 20000) throw new Error('unvollständig');
      try { localStorage.setItem(KEY, html); } catch(e) {}
      if (done) return;          // zu langsam: beim nächsten Start gibt es die neue Version
      done = true; clearTimeout(timer); show(html);
    })
    .catch(function(){ if(!done){ done = true; clearTimeout(timer); offline(); } });
})();
</script>
</body>
</html>
